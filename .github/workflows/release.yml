name: Build & Release APK

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Tulis local.properties dari secrets
        run: |
          cat > local.properties << 'EOF'
          supabase.url=${{ secrets.SUPABASE_URL }}
          supabase.anonKey=${{ secrets.SUPABASE_ANON_KEY }}
          ninerouter.url=${{ secrets.NINEROUTER_URL }}
          ninerouter.key=${{ secrets.NINEROUTER_KEY }}
          ninerouter.model=${{ secrets.NINEROUTER_MODEL }}
          update.url=https://raw.githubusercontent.com/${{ github.repository }}/main/version.json
          update.token=${{ secrets.GH_TOKEN }}
          EOF

      - name: Build release APK
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Ambil versionName
        id: ver
        run: |
          VN=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          VC=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/[^0-9]//g')
          echo "name=$VN" >> $GITHUB_OUTPUT
          echo "code=$VC" >> $GITHUB_OUTPUT

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: v${{ steps.ver.outputs.name }}
          body: "KeuanganKu v${{ steps.ver.outputs.name }} — update dari aplikasi (Lainnya → Cek Pembaruan)."

      - name: Update version.json
        run: |
          cat > version.json << EOF
          {
            "version_code": ${{ steps.ver.outputs.code }},
            "version_name": "${{ steps.ver.outputs.name }}",
            "apk_url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-release.apk",
            "changelog": "Update ke v${{ steps.ver.outputs.name }} tersedia."
          }
          EOF
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add version.json
          git commit -m "Otomatis: version.json -> v${{ steps.ver.outputs.name }}" || echo "tidak ada perubahan"
          git push origin HEAD:main
